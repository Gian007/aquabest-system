name: Check AquaBest frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/mobile-order-flow-3steps]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run test:backend
